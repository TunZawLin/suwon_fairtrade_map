    <style>
      :root {
        --fair-blue: #12336e;
        --fair-green: #2f7d59;
        --fair-cyan: #16b7d7;
        --fair-lime: #c7df3a;
        --fair-black: #1f1f21;
        --ink: #202832;
        --muted: #687482;
        --line: #d9e0e5;
        --paper: #f5f7f8;
        --panel: #ffffff;
        font-family:
          "Noto Sans KR", Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100svh;
        color: var(--ink);
        background: var(--paper);
      }

      button {
        font: inherit;
      }

      .page {
        min-height: 100svh;
        padding: 22px;
      }

      .intro {
        max-width: 1180px;
        margin: 0 auto 14px;
      }

      .intro-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
      }

      h1 {
        margin: 0;
        color: var(--fair-blue);
        font-size: clamp(1.45rem, 2vw, 1.85rem);
        line-height: 1.18;
      }

      .intro-copy {
        max-width: 850px;
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 0.94rem;
        line-height: 1.55;
      }

      .language-toggle {
        display: inline-flex;
        flex: 0 0 auto;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #fff;
      }

      .lang-button {
        border: 0;
        padding: 7px 12px;
        color: var(--muted);
        font-size: 0.78rem;
        font-weight: 800;
        background: transparent;
        cursor: pointer;
      }

      .lang-button[aria-pressed="true"] {
        color: #fff;
        background: var(--fair-blue);
      }

      .map-shell {
        display: grid;
        grid-template-columns: 340px 1fr;
        width: 100%;
        max-width: 1180px;
        height: min(76svh, 720px);
        min-height: 620px;
        margin: 0 auto;
        border: 1px solid var(--line);
        border-radius: 4px;
        overflow: hidden;
        background: var(--panel);
        box-shadow: 0 14px 32px rgba(25, 39, 55, 0.12);
      }

      .directory {
        display: flex;
        min-height: 0;
        flex-direction: column;
        border-right: 1px solid var(--line);
        background: var(--panel);
      }

      .directory-head {
        padding: 13px 14px 12px;
        color: #fff;
        background: var(--fair-blue);
      }

      .directory-head h2 {
        margin: 0;
        font-size: 0.92rem;
        line-height: 1.3;
      }



      .city-tabs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
        padding: 9px 12px;
        border-bottom: 1px solid var(--line);
        background: #f8fafb;
      }

      .city-tab {
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 6px 10px;
        color: var(--fair-blue);
        font-size: 0.72rem;
        font-weight: 900;
        background: #fff;
        cursor: pointer;
      }

      .city-tab[aria-selected="true"] {
        border-color: var(--fair-cyan);
        color: var(--fair-black);
        background: var(--fair-lime);
      }

      .region-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        border-bottom: 1px solid var(--line);
        padding: 8px 12px;
        background: #f8fafb;
      }

      .region-bar strong {
        color: var(--fair-blue);
        font-size: 0.8rem;
      }

      .count {
        border-radius: 999px;
        padding: 3px 7px;
        color: #fff;
        font-size: 0.64rem;
        font-weight: 800;
        background: var(--fair-green);
      }

      .place-list {
        display: grid;
        min-height: 0;
        overflow: auto;
      }

      .place {
        display: grid;
        gap: 5px;
        width: 100%;
        border: 0;
        border-bottom: 1px solid var(--line);
        padding: 9px 12px;
        color: var(--ink);
        text-align: left;
        background: #fff;
        cursor: pointer;
      }

      .place:hover,
      .place[aria-pressed="true"] {
        background: #edf8ee;
      }

      .place.official {
        background: #f4fbfd;
      }

      .place.official:hover,
      .place.official[aria-pressed="true"] {
        background: #e5f7fb;
      }

      .place-title {
        display: flex;
        gap: 8px;
        align-items: flex-start;
      }

      .marker-number {
        display: grid;
        flex: 0 0 auto;
        width: 20px;
        height: 20px;
        place-items: center;
        border-radius: 50%;
        color: #fff;
        font-size: 0.66rem;
        font-weight: 900;
        background: var(--fair-green);
      }

      .marker-number.official {
        background: var(--fair-cyan);
        color: var(--fair-black);
      }

      .tag {
        display: inline-flex;
        width: fit-content;
        border-radius: 999px;
        padding: 2px 7px;
        color: #fff;
        font-size: 0.58rem;
        font-weight: 800;
        background: var(--fair-black);
        box-shadow: inset 4px 0 0 var(--fair-lime);
      }

      .place strong {
        font-size: 0.76rem;
        line-height: 1.35;
      }

      .place p {
        margin: 0;
        color: var(--muted);
        font-size: 0.66rem;
        line-height: 1.4;
      }

      .products {
        color: var(--fair-blue);
        font-weight: 700;
      }

      .map-area {
        position: relative;
        height: 100%;
        min-height: 620px;
        background: #eef2f5;
      }

      #map {
        position: relative;
        width: 100%;
        height: 100%;
        min-height: 620px;
      }

      .map-status {
        position: absolute;
        inset: 0;
        z-index: 5;
        display: grid;
        place-items: center;
        padding: 24px;
        color: var(--muted);
        text-align: center;
        background: #f8fafb;
      }

      .map-status.hidden {
        display: none;
      }

      .source {
        max-width: 1180px;
        margin: 10px auto 0;
        color: var(--muted);
        font-size: 0.78rem;
        line-height: 1.5;
      }

        color: #2868b8;
      }

        font-weight: 700;
        text-decoration: none;
        background: #fff;

      .close-info {
        position: absolute;
        top: 8px;
        right: 8px;
        display: grid;
        width: 22px;
        height: 22px;
        place-items: center;
        padding: 0;
        border: 0;
        border-radius: 50%;
        appearance: none;
        color: #fff;
        font-size: 0;
        line-height: 1;
        background: var(--fair-cyan);
        cursor: pointer;
      }

      .close-info::before,
      .close-info::after {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        width: 11px;
        height: 2px;
        border-radius: 999px;
        background: #fff;
        transform-origin: center;
      }

      .close-info::before {
        transform: translate(-50%, -50%) rotate(45deg);
      }

      .close-info::after {
        transform: translate(-50%, -50%) rotate(-45deg);
      }

      function naverMapLink(shop) {
        const query = (shop.address || "").trim();
        return query
          ? `https://map.naver.com/p/search/${encodeURIComponent(query)}`
          : "https://map.naver.com/p";
      }

      function googleMapLink(shop) {
        if (Number.isFinite(shop.lat) && Number.isFinite(shop.lng)) {
          return `https://www.google.com/maps/search/?api=1&query=${shop.lat},${shop.lng}`;
        }
        return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(shop.address)}`;
      }

      const status = document.querySelector("#map-status");
      const list = document.querySelector("#place-list");

      const activeRegion = document.querySelector("#active-region");

      const directory = document.querySelector("#directory");

      let activeCity = "suwon";
      let map = null;
      let mapsApi = null;
      let selectedShop = 0;
      let currentLanguage = localStorage.getItem("fairTradeMapLanguage") === "en" ? "en" : "ko";

      function t(key, ...args) {
        const value = translations[currentLanguage][key] ?? translations.ko[key] ?? key;
        return typeof value === "function" ? value(...args) : value;
      }

      function shopName(shop) {
        return currentLanguage === "en" ? shop.nameEn || nameTranslations[shop.name] || shop.name : shop.name;
      }

      function capitalizeFirst(value) {
        if (!value || currentLanguage !== "en") return value;
        return value.charAt(0).toUpperCase() + value.slice(1);
      }

      function shopProducts(shop) {
        const products = shop.products || t("productsNotListed");
        const localized = currentLanguage === "en"
          ? shop.productsEn || productTranslations[products] || products
          : products;
        return capitalizeFirst(localized);
      }

      function shopAddress(shop) {
        return shop.address;
      }

      function filteredShopEntries() {
        return allShops
          .map((shop, index) => ({ shop, index }))
          .filter(({ shop }) => shop.city === activeCity);
      }

      function updatePlaceCount() {
        const visibleTotal = filteredShopEntries().length;
        placeCount.textContent = t("count", visibleTotal);
        activeRegion.textContent = t(activeCity === "suwon" ? "citySuwon" : "citySeoul");
        document.querySelectorAll("[data-city]").forEach((button) => {
          const selected = button.dataset.city === activeCity;
          button.setAttribute("aria-selected", String(selected));
          button.textContent = t(button.dataset.city === "suwon" ? "citySuwon" : "citySeoul");
        });
      }

      function renderStaticText() {
        document.documentElement.lang = currentLanguage;
        document.title = t("documentTitle");
        document.querySelectorAll("[data-i18n]").forEach((element) => {
          element.textContent = t(element.dataset.i18n);
        });
        updatePlaceCount();
        mapShell.setAttribute("aria-label", t("mapShellLabel"));
        directory.setAttribute("aria-label", t("directoryLabel"));
        document.querySelectorAll("[data-lang]").forEach((button) => {
          button.setAttribute("aria-pressed", String(button.dataset.lang === currentLanguage));
        });
      }

      function createInfoContent(shop, index) {
        return `
          <div class="info">
            <button class="close-info" type="button" data-close-info="${index}" onclick="window.closeInfoWindow(${index}); return false;" aria-label="${t("closePopup")}">×</button>
            <h3>${shopName(shop)}</h3>
            ${shop.source === "official" ? `<span class="info-badge">${t("certified")}</span>` : ""}
            <div class="info-fields">
              <div class="info-row">
                <span class="info-label">${t("addressLabel")}</span>
                <p>${shopAddress(shop)}</p>
              </div>
              <div class="info-row">
                <span class="info-label">${t("productLabel")}</span>
                <p>${shopProducts(shop)}</p>
              </div>
              ${
                shop.phone
                  ? `<div class="info-row">
                      <span class="info-label">${t("phoneLabel")}</span>
                      <p>${shop.phone}</p>
                    </div>`
                  : ""
              }
            </div>
            <div class="info-actions">
              <a href="${naverMapLink(shop)}" target="_blank" rel="noreferrer">${t("naverMap")}</a>
              <a href="${googleMapLink(shop)}" target="_blank" rel="noreferrer">${t("googleMap")}</a>
            </div>
          </div>
        `;
      }

      function refreshInfoWindows() {
        infoWindows.forEach((infoWindow, index) => {
          if (typeof infoWindow.setContent === "function") {
            infoWindow.setContent(createInfoContent(allShops[index], index));
          }
        });
        markers.forEach((marker, index) => {
          if (typeof marker.setTitle === "function") {
            marker.setTitle(shopName(allShops[index]));
          }
        });
      }

      function setLanguage(language) {
        currentLanguage = language;
        localStorage.setItem("fairTradeMapLanguage", currentLanguage);
        renderStaticText();
        renderList();
        refreshInfoWindows();
      }

      document.querySelectorAll("[data-lang]").forEach((button) => {
        button.addEventListener("click", () => setLanguage(button.dataset.lang));
      });

      document.querySelectorAll("[data-city]").forEach((button) => {
        button.addEventListener("click", () => setCity(button.dataset.city));
      });

      window.navermap_authFailure = function navermap_authFailure() {
        status.classList.remove("hidden");
        status.textContent = t("authFailure");
      };

      function renderList() {
        list.innerHTML = "";
        filteredShopEntries().forEach(({ shop, index }, visibleIndex) => {
          const number = visibleIndex + 1;
          const item = document.createElement("button");
          item.className = `place ${shop.source === "official" ? "official" : ""}`;
          item.type = "button";
          item.dataset.shop = String(index);
          item.setAttribute("aria-pressed", String(index === selectedShop));
          item.innerHTML = `
            <span class="place-title">
              <span class="marker-number ${shop.source === "official" ? "official" : ""}">${number}</span>
              <strong>${shopName(shop)}</strong>
            </span>
            ${shop.source === "official" ? `<span class="tag">${t("certified")}</span>` : ""}
            <p>${shopAddress(shop)}</p>
            <p class="products">${shopProducts(shop)}</p>
          `;
          item.addEventListener("click", () => selectShop(index, true));
          list.appendChild(item);
        });
      }

      function updateSelectedListItem() {
        document.querySelectorAll(".place").forEach((button) => {
          button.setAttribute("aria-pressed", String(Number(button.dataset.shop) === selectedShop));
        });
      }

      function syncMarkerVisibility() {
        if (!map) return;
        markers.forEach((marker, index) => {
          if (typeof marker.setMap === "function") {
            marker.setMap(allShops[index].city === activeCity ? map : null);
          }
        });
      }

      function setCity(city) {
        if (!cityCenters[city]) return;
        activeCity = city;
        const firstVisible = filteredShopEntries()[0];
        selectedShop = firstVisible ? firstVisible.index : -1;
        renderStaticText();
        renderList();
        infoWindows.forEach((infoWindow) => infoWindow.close());
        syncMarkerVisibility();
        if (map && mapsApi) {
          const center = cityCenters[activeCity];
          map.setCenter(new mapsApi.LatLng(center.lat, center.lng));
          map.setZoom(center.zoom);
        }
      }

      function selectShop(index, moveMap) {
        selectedShop = index;
        updateSelectedListItem();
        if (!map || !markers[index] || !infoWindows[index]) {
          status.classList.remove("hidden");
          status.textContent = t("selectedBlocked", serviceOrigin);
          return;
        }

        infoWindows.forEach((infoWindow) => infoWindow.close());
        const shop = allShops[index];
        if (moveMap) {
          map.setCenter(new mapsApi.LatLng(shop.lat, shop.lng));
          map.setZoom(15);
        }
        infoWindows[index].open(map, markers[index]);
      }

      window.closeInfoWindow = function closeInfoWindow(index) {
        if (typeof index === "number" && infoWindows[index]) {
          infoWindows[index].close();
          return;
        }
        infoWindows.forEach((infoWindow) => infoWindow.close());
      };

      document.addEventListener("click", (event) => {
        const closeButton = event.target.closest("[data-close-info]");
        if (!closeButton) return;
        window.closeInfoWindow(Number(closeButton.dataset.closeInfo));
      });

      function getMaps(api) {
        if (api && api.Map) return api;
        if (api && api.maps && api.maps.Map) return api.maps;
        if (window.naver && window.naver.maps && window.naver.maps.Map) return window.naver.maps;
        return null;
      }

      window.initMap = function initMap(api) {
        const maps = getMaps(api);
        if (!maps) {
          status.classList.remove("hidden");
          status.textContent = t("apiWrong");
          return;
        }

        mapsApi = maps;
        status.textContent = t("mapLoading");

        const center = cityCenters[activeCity];
        map = new maps.Map("map", {
          center: new maps.LatLng(center.lat, center.lng),
          zoom: center.zoom,
          minZoom: 11,
          maxZoom: 18,
          mapTypeControl: false,
          mapDataControl: false,
          scaleControl: false,
          zoomControl: true,
          zoomControlOptions: {
            position: maps.Position.TOP_RIGHT,
          },
        });

        allShops.forEach((shop, index) => {
          const position = new maps.LatLng(shop.lat, shop.lng);
          const markerOptions = {
            position,
            map,
            title: shopName(shop),
            icon: {
              content: `<span class="pin ${shop.source === "official" ? "official" : ""}" aria-label="${shop.source === "official" ? "fairtrade-certified shop" : "fair trade shop"}"></span>`,
              size: new maps.Size(28, 38),
              anchor: new maps.Point(14, 38),
            },
          };
          const marker = new maps.Marker(markerOptions);

          const infoWindow = new maps.InfoWindow({
            content: createInfoContent(shop, index),
            borderWidth: 0,
            backgroundColor: "white",
            anchorSize: new maps.Size(10, 10),
            pixelOffset: new maps.Point(0, -10),
          });

          maps.Event.addListener(marker, "click", () => selectShop(index, false));
          markers.push(marker);
          infoWindows.push(infoWindow);
        });

        window.addEventListener("resize", () => {
          maps.Event.trigger(map, "resize");
        });

        setTimeout(() => {
          maps.Event.trigger(map, "resize");
          const currentCenter = cityCenters[activeCity];
          syncMarkerVisibility();
          map.setCenter(new maps.LatLng(currentCenter.lat, currentCenter.lng));
          map.setZoom(currentCenter.zoom);
          status.classList.add("hidden");
        }, 500);
      };

      window.naverMapLoadFailed = function naverMapLoadFailed() {
        status.classList.remove("hidden");
        status.textContent = t("scriptFailed", serviceOrigin);
      };

      renderStaticText();
      renderList();
    </script>
    <script
      src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=jmjfpzqt8g&v=20260604"
      onload="initMap()"
      onerror="naverMapLoadFailed()"
    ></script>
  </body>
</html>
